<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INVOXEA // SYSTEM</title>
    
    <!-- Load required libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Early 2000s / Brutalist Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Mono', monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        /* Y2K Grid Background Overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #p5-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; 
        }

        #ui-layer {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 2rem;
            pointer-events: none; 
        }

        header, footer, .cta-btn, .nav-links a {
            pointer-events: auto; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 1rem;
        }

        .brand-name {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #fff;
            text-shadow: 2px 2px 0px #ff003c, -2px -2px 0px #00f0ff; /* Glitch effect */
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            border: 1px solid transparent;
            padding: 5px 10px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            border: 1px solid #fff;
            background: rgba(255,255,255,0.1);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin: 0;
            text-align: center;
            line-height: 0.9;
            color: transparent;
            -webkit-text-stroke: 1px #fff;
            opacity: 0;
        }

        .badge {
            margin-top: 2rem;
            padding: 0.5rem 1rem;
            border: 1px solid #fff;
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #000;
            opacity: 0;
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 1rem;
            text-transform: uppercase;
            opacity: 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #ui-layer {
                padding: 1rem;
            }
            header {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
                border-bottom: none;
            }
            .nav-links {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
                font-size: 0.7rem;
            }
            h1 {
                font-size: 3rem;
                -webkit-text-stroke: 0.5px #fff;
            }
            footer {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>
    <div id="three-container"></div>
    <div id="p5-container"></div>

    <div id="ui-layer">
        <header id="nav-header">
            <div class="brand-name">INVOXEA</div>
            <nav class="nav-links">
                <a href="#">[ Collections ]</a>
                <a href="#">[ Digitals ]</a>
                <a href="#">[ Events ]</a>
                <a href="#">[ Vault ]</a>
            </nav>
        </header>

        <main>
            <h1 id="main-title">SYS<br>CORE</h1>
            <div class="badge" id="sub-title">VER 2.0.26 // ONLINE</div>
        </main>

        <footer id="footer">
            <span>FILE: INVOX_ROOT_DIR</span>
            <span id="coord-display">X: 000 Y: 000</span>
        </footer>
    </div>

    <script>
        // --- 1. THREE.JS 3D ENVIRONMENT (Chrome / Brutal 3D) ---
        let artifact;
        const initThreeJS = () => {
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 6;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Perf optimization
            container.appendChild(renderer.domElement);

            // Chrome Torus Knot
            const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 128, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xaaaaaa, 
                roughness: 0.1,
                metalness: 1.0,
                wireframe: false
            });
            
            artifact = new THREE.Mesh(geometry, material);
            scene.add(artifact);

            // Add an inner wireframe clone for the edgy tech look
            const wireMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.1 });
            const wireframe = new THREE.Mesh(geometry, wireMaterial);
            wireframe.scale.set(1.02, 1.02, 1.02);
            artifact.add(wireframe);

            // Harsh Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const pointLight1 = new THREE.PointLight(0xff003c, 5, 50); // Neon Pink/Red hit
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00f0ff, 5, 50); // Cyan hit
            pointLight2.position.set(-5, -5, 2);
            scene.add(pointLight2);

            // Adjust scale for mobile
            if (window.innerWidth < 768) {
                artifact.scale.set(0.6, 0.6, 0.6);
            }

            const clock = new THREE.Clock();
            const animate = () => {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();
                
                // Erratic, mechanical rotation
                artifact.rotation.x += Math.sin(time) * 0.005;
                artifact.rotation.y += 0.01;
                artifact.rotation.z = Math.cos(time * 0.5) * 0.2;

                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                if (window.innerWidth < 768) {
                    artifact.scale.set(0.6, 0.6, 0.6);
                } else {
                    artifact.scale.set(1, 1, 1);
                }
            });
        };

        // --- 2. P5.JS INTERACTIVE HUD (Crosshairs & Glitch Trails) ---
        const initP5 = () => {
            new p5((p) => {
                let trail = [];

                p.setup = () => {
                    let canvas = p.createCanvas(p.windowWidth, p.windowHeight);
                    canvas.parent('p5-container');
                    p.noCursor(); // Hide default cursor over canvas
                };

                p.draw = () => {
                    p.clear();
                    
                    let mx = p.mouseX || p.width / 2;
                    let my = p.mouseY || p.height / 2;

                    // Update UI Coordinates
                    if (p.frameCount % 5 === 0) {
                        document.getElementById('coord-display').innerText = `X: ${Math.round(mx)} Y: ${Math.round(my)}`;
                    }

                    // Draw trail
                    trail.push({x: mx, y: my});
                    if (trail.length > 15) trail.shift();

                    p.noFill();
                    p.stroke(255, 50);
                    p.strokeWeight(1);
                    p.beginShape();
                    for (let i = 0; i < trail.length; i++) {
                        p.vertex(trail[i].x, trail[i].y);
                    }
                    p.endShape();

                    // HUD Crosshair
                    p.stroke(255);
                    p.strokeWeight(1);
                    p.line(mx - 20, my, mx - 5, my);
                    p.line(mx + 5, my, mx + 20, my);
                    p.line(mx, my - 20, mx, my - 5);
                    p.line(mx, my + 5, mx, my + 20);
                    
                    // Center dot
                    p.fill(255);
                    p.rect(mx - 1, my - 1, 2, 2);
                };

                // Add erratic spin to 3D object on click/touch
                p.mousePressed = () => {
                    if(artifact) {
                        gsap.to(artifact.rotation, {
                            x: artifact.rotation.x + Math.PI,
                            y: artifact.rotation.y + Math.PI / 2,
                            duration: 1,
                            ease: "power4.out"
                        });
                    }
                };

                p.windowResized = () => {
                    p.resizeCanvas(p.windowWidth, p.windowHeight);
                };
            });
        };

        // --- 3. GSAP BRUTALIST ANIMATIONS ---
        const initAnimations = () => {
            // Glitchy fade in
            gsap.fromTo("#nav-header", 
                { opacity: 0, y: -20 }, 
                { opacity: 1, y: 0, duration: 1, ease: "steps(5)" }
            );
            
            gsap.fromTo("#main-title", 
                { opacity: 0, scale: 0.9, filter: "blur(10px)" }, 
                { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.5, delay: 0.2, ease: "power3.out" }
            );

            gsap.fromTo("#sub-title", 
                { opacity: 0, x: -20 }, 
                { opacity: 1, x: 0, duration: 0.5, delay: 1, ease: "steps(3)" }
            );

            gsap.fromTo("#footer", 
                { opacity: 0 }, 
                { opacity: 1, duration: 1, delay: 1.2, ease: "power1.inOut" }
            );
        };

        window.onload = () => {
            initThreeJS();
            initP5();
            initAnimations();
        };
    </script>
</body>
</html>
