<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVOXEA</title>
    
    <!-- Load required libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* CSS Reset & Minimalist Pulse Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Layering system */
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #p5-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Lets clicks pass through to UI */
        }

        #ui-layer {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 2.5rem;
            pointer-events: none; /* Wrapper allows clicks to pass */
        }

        /* Make UI elements clickable again */
        header, footer, .cta {
            pointer-events: auto; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: bold;
            mix-blend-mode: difference;
        }

        nav {
            display: flex;
            gap: 3rem;
            font-size: 0.75rem;
            mix-blend-mode: difference;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.5;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h1 {
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 0;
            text-align: center;
            mix-blend-mode: difference;
            font-weight: 300;
            opacity: 0; /* Handled by GSAP */
            transform: translateY(20px);
        }

        p.subtitle {
            margin-top: 1.5rem;
            letter-spacing: 0.15em;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- WebGL Background Layer -->
    <div id="three-container"></div>

    <!-- 2D Generative Overlay Layer -->
    <div id="p5-container"></div>

    <!-- User Interface Layer -->
    <div id="ui-layer">
        <header id="nav-header">
            <div class="brand-name">INVOXEA</div>
            <nav>
                <a href="#">Collections</a>
                <a href="#">Digital Works</a>
                <a href="#">Events</a>
                <a href="#">Login / Vault</a>
            </nav>
        </header>

        <main class="cta">
            <h1 id="main-title">Enter System</h1>
            <p class="subtitle" id="sub-title">Physical // Digital // Spatial</p>
        </main>

        <footer id="footer">
            <span>© 2026 INVOXEA LTD.</span>
            <span>System Active // Latency: 12ms</span>
        </footer>
    </div>

    <script>
        // --- 1. THREE.JS 3D ENVIRONMENT ---
        const initThreeJS = () => {
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Create the wireframe artifact
            const geometry = new THREE.IcosahedronGeometry(1.5, 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                wireframe: true,
                roughness: 0.2,
                metalness: 0.8
            });
            const artifact = new THREE.Mesh(geometry, material);
            scene.add(artifact);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            // Animation Loop
            const clock = new THREE.Clock();
            const animate = () => {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();
                
                // Rotate and float
                artifact.rotation.x = elapsedTime * 0.15;
                artifact.rotation.y = elapsedTime * 0.2;
                artifact.position.y = Math.sin(elapsedTime * 1.5) * 0.2;

                renderer.render(scene, camera);
            };
            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // --- 2. P5.JS GENERATIVE OVERLAY ---
        // Using "Instance Mode" to isolate p5 from Three.js and global variables
        const initP5 = () => {
            new p5((p) => {
                let particles = [];

                p.setup = () => {
                    let canvas = p.createCanvas(p.windowWidth, p.windowHeight);
                    canvas.parent('p5-container');
                    
                    for (let i = 0; i < 40; i++) {
                        particles.push({
                            x: p.random(p.width),
                            y: p.random(p.height),
                            vx: p.random(-0.5, 0.5),
                            vy: p.random(-0.5, 0.5)
                        });
                    }
                };

                p.draw = () => {
                    p.clear(); // Keeps background transparent
                    p.stroke(255, 35);
                    p.strokeWeight(1);
                    
                    particles.forEach((pt) => {
                        pt.x += pt.vx;
                        pt.y += pt.vy;
                        
                        // Bounce off walls
                        if (pt.x < 0 || pt.x > p.width) pt.vx *= -1;
                        if (pt.y < 0 || pt.y > p.height) pt.vy *= -1;
                        
                        // Draw lines if close to mouse
                        let d = p.dist(p.mouseX, p.mouseY, pt.x, pt.y);
                        if (d < 180) {
                            p.line(p.mouseX, p.mouseY, pt.x, pt.y);
                        }
                    });
                };

                p.windowResized = () => {
                    p.resizeCanvas(p.windowWidth, p.windowHeight);
                };
            });
        };

        // --- 3. GSAP UI ANIMATIONS ---
        const initAnimations = () => {
            gsap.to("#nav-header", { opacity: 1, duration: 1.5, ease: "power2.out" });
            gsap.to("#main-title", { y: 0, opacity: 1, duration: 1, delay: 0.5, ease: "power2.out" });
            gsap.to("#sub-title", { y: 0, opacity: 1, duration: 1, delay: 0.7, ease: "power2.out" });
            gsap.to("#footer", { opacity: 1, duration: 1, delay: 1, ease: "power2.out" });
        };

        // Initialize everything when the DOM is ready
        window.onload = () => {
            initThreeJS();
            initP5();
            initAnimations();
        };
    </script>
</body>
</html>
